name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  python-checks:
    name: Python checks (AI + back_end)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install AI requirements
        run: |
          if [ -f "AI/requirements.txt" ]; then
            pip install -r AI/requirements.txt
          else
            echo "AI/requirements.txt not found - skipping"
          fi

      - name: Install back_end requirements
        run: |
          if [ -f "back_end/requirements.txt" ]; then
            pip install -r back_end/requirements.txt
          else
            echo "back_end/requirements.txt not found - skipping"
          fi

      - name: Compile all Python files
        run: python -m compileall AI back_end common

      - name: Import sanity checks
        run: |
          python -c "import AI"
          python -c "import back_end"
          python -c "import common"

  frontend-build:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aiba:ci .
